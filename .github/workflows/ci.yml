name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check README links
        run: node index.js README.md
